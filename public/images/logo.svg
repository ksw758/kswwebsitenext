<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" rx="8" fill="#3D2B1F"/>
  <!-- Corner brackets -->
  <polyline points="16,16 16,32 32,32" fill="none" stroke="#C9A84C" stroke-width="2" opacity="0.55"/>
  <polyline points="184,16 184,32 168,32" fill="none" stroke="#C9A84C" stroke-width="2" opacity="0.55"/>
  <polyline points="16,184 16,168 32,168" fill="none" stroke="#C9A84C" stroke-width="2" opacity="0.55"/>
  <polyline points="184,184 184,168 168,168" fill="none" stroke="#C9A84C" stroke-width="2" opacity="0.55"/>
  <!-- Top rule -->
  <line x1="40" y1="62" x2="160" y2="62" stroke="#C9A84C" stroke-width="1" opacity="0.55"/>
  <!-- SW -->
  <text x="100" y="138" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#C9A84C" text-anchor="middle" letter-spacing="-4">SW</text>
  <!-- Bottom rule -->
  <line x1="40" y1="148" x2="160" y2="148" stroke="#C9A84C" stroke-width="1" opacity="0.55"/>
  <!-- Sub label -->
  <text x="100" y="166" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#F5F0E8" text-anchor="middle" letter-spacing="5" opacity="0.75">AGENTS</text>
</svg>
